# GitGuardian Configuration
# Excludes test directories and fixtures from secret scanning

version: 2

# Paths to ignore during scanning
paths-ignore:
  # Test directories
  - "**/__tests__/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.test.js"
  - "**/*.test.jsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/*.spec.js"
  - "**/*.spec.jsx"

  # Test fixtures and mocks
  - "**/fixtures/**"
  - "**/mocks/**"
  - "**/__mocks__/**"

  # Backend test directories
  - "backend/tests/**"
  - "backend/test_*.py"

  # Node modules and build artifacts
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.next/**"
