# Nginx config for pilar.cp2b.unicamp.br
#
# How to install:
#   sudo cp pilar.cp2b.unicamp.br.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/pilar.cp2b.unicamp.br.conf /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# SSL cert (expand existing Let's Encrypt cert):
#   sudo certbot --expand -d cp2b.unicamp.br -d pilar.cp2b.unicamp.br

server {
    listen 80;
    server_name pilar.cp2b.unicamp.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pilar.cp2b.unicamp.br;

    ssl_certificate     /etc/letsencrypt/live/cp2b.unicamp.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cp2b.unicamp.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Geospatial queries can be slow — increase timeout
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Next.js standalone)
    location /_next/static/ {
        alias /var/www/cp2b/repo/cp2b-workspace/NewLook/frontend/.next/standalone/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
