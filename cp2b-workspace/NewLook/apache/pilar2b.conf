# Apache VirtualHost for pilar2b.cp2b.unicamp.br
#
# SSL is terminated at Unicamp's edge infrastructure — this VM only receives
# plain HTTP on port 80. The RequestHeader lines below tell Next.js and FastAPI
# that the original request arrived over HTTPS so redirects and cookies work.
#
# Install:
#   sudo cp apache/pilar2b.conf /etc/apache2/sites-available/
#   sudo a2enmod headers proxy proxy_http rewrite
#   sudo a2ensite pilar2b.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Required Apache modules (check with: sudo apache2ctl -M):
#   proxy_module, proxy_http_module, rewrite_module, headers_module

<VirtualHost *:80>
    ServerName  pilar2b.cp2b.unicamp.br
    ServerAdmin noc@unicamp.br

    # Inform upstream services that the original request was HTTPS
    # (SSL terminated at Unicamp edge before reaching this VM)
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    ProxyPreserveHost On

    # ── FastAPI backend (/api/*) ──────────────────────────────────────────────
    # uvicorn listening on 127.0.0.1:8001 (managed by PM2 as pilar-backend)
    ProxyPass        /api/ http://127.0.0.1:8001/api/
    ProxyPassReverse /api/ http://127.0.0.1:8001/api/

    # ── Next.js static assets (long-lived cache) ─────────────────────────────
    # These are content-hashed so it's safe to cache forever
    <Location "/_next/static/">
        ProxyPass        http://127.0.0.1:3002/_next/static/
        ProxyPassReverse http://127.0.0.1:3002/_next/static/
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Location>

    # ── Next.js frontend (everything else) ───────────────────────────────────
    # node .next/standalone/server.js listening on 127.0.0.1:3002 (PM2: pilar-frontend)
    ProxyPass        / http://127.0.0.1:3002/
    ProxyPassReverse / http://127.0.0.1:3002/

    ErrorLog  ${APACHE_LOG_DIR}/pilar2b-error.log
    CustomLog ${APACHE_LOG_DIR}/pilar2b-access.log combined
</VirtualHost>
