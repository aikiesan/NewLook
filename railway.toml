[build]
builder = "DOCKERFILE"
dockerfilePath = "cp2b-workspace/NewLook/backend/Dockerfile"
# Enable build cache for faster subsequent builds
watchPatterns = ["cp2b-workspace/NewLook/backend/requirements.txt", "cp2b-workspace/NewLook/backend/app/**/*.py", "cp2b-workspace/NewLook/backend/scripts/**/*.sh"]

[build.cache]
# Cache pip packages and shapefiles between builds
paths = [
  "/root/.cache/pip",
  "/app/data/shapefiles"
]

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Resource limits (CRITICAL for production stability)
# Prevents container from consuming all host resources
cpuLimit = 2.0        # 2 CPU cores maximum
memoryLimit = 4096    # 4GB RAM maximum (in MB)

# Note: For production deployment, disable serverless mode
# and use the resource limits above for predictable performance
# serverless = true  # ONLY for Railway free tier development

[service]
rootDirectory = "cp2b-workspace/NewLook/backend"
